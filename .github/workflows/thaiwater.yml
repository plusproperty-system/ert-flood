name: ThaiWater hourly

on:
  schedule:
    - cron: '17 * * * *'   # every hour at minute 17 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: thaiwater
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch ThaiWater and map stations to projects
        run: python scripts/thaiwater.py
      - name: Commit updated water data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/water
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "ThaiWater $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
