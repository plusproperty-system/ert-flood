name: BMA canal levels hourly

on:
  schedule:
    - cron: '37 * * * *'   # every hour at minute 37 (UTC)
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Fetch weather.bangkok.go.th/water and map stations to projects
        run: python scripts/bma.py
      - name: Keep the page for checking when it could not be read
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: bma-page
          path: debug/
          if-no-files-found: ignore

      - name: Commit updated data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data/bma scripts/bma_coords.csv
          if git diff --cached --quiet; then echo "no change"; exit 0; fi
          git commit -m "BMA canal levels $(TZ=Asia/Bangkok date '+%Y-%m-%d %H:%M')"
          git pull --rebase --autostash
          git push
